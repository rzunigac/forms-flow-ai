# nginx.conf
worker_processes auto;
error_log  /var/log/nginx/error.log;

pid /tmp/nginx.pid;


events {
 worker_connections 4096;
}

http {
 include       /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
 default_type  application/octet-stream;
 server_tokens off;
 underscores_in_headers on;

 # Use a w3c standard log format
 log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

 access_log  /var/log/nginx/access.log  main;

 # Content-Security-Policy violation reports, one JSON line each (location /csp-report)
 log_format csp_report escape=json '{"type":"csp-report","time":"$time_iso8601","client":"$remote_addr",'
                                   '"user_agent":"$http_user_agent","report":"$request_body"}';
 limit_req_zone $binary_remote_addr zone=csp_report:1m rate=10r/s;


 server {

   # add in most common security headers
   # Content-Security-Policy, written at container start from CSP_MODE and the configured URLs
   # (docker/41-formsflow-csp.sh)
   include /tmp/formsflow/csp.conf;
   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
   add_header X-Content-Type-Options "nosniff";
   add_header X-XSS-Protection 1;
   add_header X-Frame-Options SAMEORIGIN;



   listen 8080;
   server_name _;

   index index.html;
   error_log /dev/stdout info;
   access_log /dev/stdout;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
      }

    # Written at container start (40-formsflow-config.sh); a browser must not keep an old copy.
    location /config/ {
        root   /usr/share/nginx/html;
        expires -1;   # Cache-Control: no-cache; add_header here would drop the server headers
        try_files $uri =404;
      }

    # Micro-frontend bundles and the theme, built into the image. The names carry no version, so the
    # browser revalidates (ETag) instead of caching blindly. Pre-compressed .gz files are served when
    # the browser accepts gzip.
    location /mfe/ {
        root   /usr/share/nginx/html;
        gzip_static on;
        expires -1;   # Cache-Control: no-cache; add_header here would drop the server headers
        try_files $uri =404;
      }

    # Third-party libraries, built into the image (vendor/packages.txt). The paths carry the version,
    # so the browser may cache them for good.
    location /vendor/ {
        root   /usr/share/nginx/html;
        gzip_static on;
        expires max;
        try_files $uri =404;
      }

    # formio's runtime libraries keep cdn.form.io's paths (vendor/formio-cdn.txt), and some carry no
    # version (moment-timezone/data/packed/latest.json), so the browser revalidates them like /mfe/.
    location /vendor/formio/ {
        root   /usr/share/nginx/html;
        gzip_static on;
        expires -1;   # Cache-Control: no-cache; add_header here would drop the server headers
        try_files $uri =404;
      }

    # Browsers POST CSP violation reports here (report-uri). nginx fills $request_body only when it
    # passes the body on, hence the proxy to itself.
    location = /csp-report {
        limit_except POST { deny all; }
        limit_req zone=csp_report burst=20 nodelay;
        client_max_body_size 64k;
        client_body_buffer_size 64k;
        access_log /dev/stdout csp_report;
        proxy_pass http://127.0.0.1:8080/csp-report-received;
      }

    # Only answers; reachable from outside too, which is harmless.
    location = /csp-report-received {
        access_log off;
        return 204;
      }

      error_page   500 502 503 504  /50x.html;

        location = /50x.html {
          root   /usr/share/nginx/html;
        }
 }
}